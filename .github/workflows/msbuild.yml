# MSBuild CI workflow for yuvplayer
# Builds the MFC-based yuvplayer on Windows with MSVC.

name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Install MFC component and Build
      shell: cmd
      run: |
        :: Find VS installation path
        for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set VS_PATH=%%i
        echo Visual Studio path: %VS_PATH%
        :: Install MFC component if missing (required for this project)
        "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "%VS_PATH%" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart
        :: Build using MSBuild from the VS installation
        "%VS_PATH%\MSBuild\Current\Bin\MSBuild.exe" /m /p:Configuration=%BUILD_CONFIGURATION% %SOLUTION_FILE_PATH%

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: yuvplayer-win32-release
        path: Release/yuvplayer.exe
        if-no-files-found: error
        retention-days: 30
